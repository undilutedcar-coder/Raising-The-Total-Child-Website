<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us</title>
   <link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Join_Us.css">
</head>

    
<body> 
    <section class="Header">
  <div class="logo_link"> <a style="text-decoration:none ;" href="Home.html"><img src="For_Mummy's_Website.png" alt="Logo"><h1 class="Logo_Text">Raising The Total Child</h1></a></div>
    
        <ul class="Links">
            <li><a style="text-decoration:none ;" href="Home.html">Home</a></li>
            <li><a  style="text-decoration:none ;" href="Events.html">Events</a></li>
            <li><a style="text-decoration:none ;" href="Join_Us.html">Join Us</a></li>
            <li><a style="text-decoration:none ;" href="Find_Us.html">Find Us</a></li>
            
        </ul>
    </section>
    <main class="page-container">
  
  <!-- Left Side: Hero Info Section -->
  <section class="hero-section">
    <h1 class="hero-title">We are on <span class="highlight-text">Zoom</span></h1>
    <p class="hero-subtitle">Ages 7-17 join us for Bible Club at 4pm every Sunday.</p>
    <a href=" https://us05web.zoom.us/j/88075713979?pwd=qjTAvrEeinmp8J5Ts3IlbGjbypVCWu.1" class="btn-secondary">Join Zoom Meeting</a>
  </section>

  <!-- Right Side: Registration Form Card -->
  <section class="form-card">
    <h2 class="form-title">Join Us</h2>
    <form>
      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" placeholder="Enter your first name">
      </div>
      
      <div class="form-group">
        <label for="surname">Surname</label>
        <input type="text" id="surname" placeholder="Enter your surname">
      </div>
      
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter age (7-18)">
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address">
      </div>
      
      <button type="submit" class="btn-primary">Submit Registration</button>
      <div class="form-help-container">
  <p class="form-help-text">
    Having trouble registering? <a href="Find_Us.html" class="form-help-link">Contact our support team</a>
  </p>
</div>
    </form>
  </section>

</main>

</body>
</html>
